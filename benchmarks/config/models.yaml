# LLM providers and models to sweep across during Benchmark A.
#
# Pricing is USD per 1,000 tokens; update when provider pricing changes.
# Add a model entry only if you have the corresponding API key — the harness
# raises a clear error if the env_var listed below is unset.
#
# To add a local Ollama model, append:
#     - id: llama3.1:70b
#       provider: ollama
#       env_var: null
#       base_url: http://localhost:11434
#       pricing: {input_per_1k: 0.0, output_per_1k: 0.0}
#
# Tier semantics (matches provider docs as of May 2026):
#   current    — actively supported, flagship or mainline.
#   preview    — published preview release (not GA; may change).
#   legacy     — older generation, still callable, superseded by newer models.
#                Includes intentional comparative baselines (GPT-3.5 era,
#                Claude 3.x, Gemini 1.5) for generational figures; these
#                run in ``make plan-all`` but plot in the legacy panel.
#   deprecated — scheduled for retirement or already shut down; excluded
#                from ``make plan-all`` default sweeps (still in YAML for
#                rescoring, alias joins, and longitudinal figures).
#
# Fields: id, provider, env_var, family, tier, context_k, pricing,
#         reasoning, reasoning_default, [api_id], [notes].
# ``api_id`` — optional provider API string when it differs from ``id``
#              (common for Google Gemini versioned names). Benchmark CSVs
#              and figures always use ``id``; ``set_provider`` passes
#              ``api_id`` to the LLM client.
# The harness reads provider/env_var/pricing; the other fields are metadata
# used by the plotting code and manuscript tables.
#
# ``reasoning`` (bool) — true if the model uses chain-of-thought / hidden
#                        thinking tokens that are billed as output. Sourced
#                        from each provider's documented model card:
#                        OpenAI o-series + GPT-5.x; Anthropic extended-
#                        thinking (Opus 4.5+, Sonnet 4.5+, Haiku 4.5);
#                        Google Gemini 3.x (all variants thinking-capable),
#                        Gemini 2.5 Pro/Flash (thinking on by default),
#                        Gemini 2.5 Flash-Lite (thinking off by default).
#                        This field is the SINGLE source of truth for the
#                        ``recovery_reasoning_split`` figure — the previous
#                        in-code allowlist excluded Sonnet 4.6, Gemini 3.x,
#                        and Gemini 2.5 Pro/Flash, mis-grouping them as
#                        non-reasoning despite their model cards.
# ``reasoning_default`` — the default reasoning effort sent to the provider
#                         when the harness does not override it. ``none``
#                         on non-reasoning models.

defaults:
  timeout_seconds: 300
  max_retries: 3
  # Date the per-model ``pricing`` blocks below were captured from the
  # providers' public price lists (provider docs as of May 2026). Cost
  # figures are only reproducible against the rates in effect on this
  # date — see Supplementary Table 4 (``make_supp_table4.py``). Bump this
  # whenever pricing is re-checked; override per model with a
  # ``pricing_as_of:`` field if a single model's rate is updated alone.
  pricing_snapshot: "2026-05"

