          mitochondrial reads were correctly filtered upstream.
        choices:
          A: Around 50% (mitochondrial contamination dominates).
          B: A small minority or zero (mt reads correctly filtered).
          C: Exactly 100% (only chrM peaks remain).
          D: I cannot determine this from the supplied data.
        # In a properly QC'd ATAC consensus atlas, mitochondrial peaks
