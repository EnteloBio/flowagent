        answer: B
        refusal_acceptable: false
      - id: gse74912_q04_summary
        type: open_ended
        evidence_class: data_required
        depends_on_inputs: [peaks]
        question: >-
          In two to three sentences, summarise the SUPPLIED
          consensus peak file: order-of-magnitude peak count,
