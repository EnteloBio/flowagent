          appear to have been filtered upstream. Stick to
          claims derivable from the BED file; do not speculate
          about cell-type identity or downstream biology.
        rubric: |-
          Strong answers cite values readable from the BED file:
          a peak count in the low- to mid-six-figure range,
          typical width in low-to-mid hundreds of base pairs,
          and a small chrM fraction consistent with proper
          ATAC mitochondrial filtering. Penalise speculative
          claims about specific lineage TF binding, GWAS
          interpretation, or differentiation trajectories that
          go beyond the supplied evidence.

  # ── GIAB NA12878 chr20 truth-set variant calling ────────────────
